name: 更新直播源

on:
  schedule:
    # 每天 3 次（北京时间 08:03 / 13:17 / 19:41，即 UTC 00:03 / 05:17 / 11:41）
    - cron: "3 0 * * *"
    - cron: "17 5 * * *"
    - cron: "41 11 * * *"
  workflow_dispatch:   # 允许手动触发

permissions:
  contents: write
  issues: write    # 失败时创建告警 Issue

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 抓取并验证直播源
        env:
          # GitHub 境外 runner 被 CDN 限速时通过率极低，低于阈值则保留旧订阅
          IPTV_MIN_OK: "50"
        run: python iptv.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv.txt
          if git diff --cached --quiet; then
            echo "直播源无变化，跳过提交"
          else
            git commit -m "chore: 更新直播源 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 失败时创建告警 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --state open --label alert --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            BODY="定时任务运行失败，订阅文件未更新。
运行日志: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
常见原因：境外 runner 被 CDN 限速导致通过率低于阈值，或源站接口/签名算法变更。"
            gh issue create --label alert --title "直播源更新失败 $(date -u '+%Y-%m-%d')" --body "$BODY"
          fi

      - name: 成功后关闭告警 Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for N in $(gh issue list --state open --label alert --json number --jq '.[].number'); do
            gh issue close "$N" --comment "已恢复正常，自动关闭。"
          done
