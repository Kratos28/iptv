name: 更新直播源

on:
  schedule:
    # 每天 3 次（北京时间 08:03 / 13:17 / 19:41，即 UTC 00:03 / 05:17 / 11:41）
    - cron: "3 0 * * *"
    - cron: "17 5 * * *"
    - cron: "41 11 * * *"
  workflow_dispatch:   # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 抓取并验证直播源
        env:
          # GitHub 境外 runner 被 CDN 限速时通过率极低，低于阈值则保留旧订阅
          IPTV_MIN_OK: "50"
        run: python migu_iptv.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv.txt
          if git diff --cached --quiet; then
            echo "直播源无变化，跳过提交"
          else
            git commit -m "chore: 更新直播源 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
